<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0d0c">
<title>Sign in · Behind the Jersey</title>
<style>
  /* Big Shoulders Display (OFL, see /fonts/OFL.txt), the site's display face. */
  @font-face {
    font-family: 'Big Shoulders Display';
    font-weight: 700 900;
    font-display: swap;
    src: url('big-shoulders-display-latin.woff2') format('woff2');
  }
  :root {
    --bg: #0f0d0c; --panel: #1a1614; --line: #3a3330; --text: #f3ede6; --text-3: #b3aaa0;
    --accent-soft: #ff6b5e; --splat: #d61f26; --cta-red: #c8191f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.5 'Schibsted Grotesk', 'Helvetica Neue', system-ui, sans-serif;
    display: grid; place-items: center; min-height: 100vh; padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 400px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand span { font: 900 22px/1 'Big Shoulders Display', Impact, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
  h1 { font: 900 44px/1 'Big Shoulders Display', Impact, sans-serif; text-transform: uppercase; margin: 0 0 12px; }
  p { margin: 0 0 24px; color: var(--text-3); }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  button {
    margin-top: 16px; width: 100%; padding: 12px 16px; font: inherit; font-weight: 700; color: #fff;
    background: var(--cta-red); border: 0; border-radius: 6px; cursor: pointer;
  }
  button[disabled] { opacity: 0.7; cursor: progress; }
  .msg { min-height: 24px; margin: 12px 0 0; font-size: 14px; }
  .msg.error { color: var(--accent-soft); }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8.5 3 Q12 5.6 15.5 3 L19.6 4.3 L23 8.6 L20.3 11.4 L18.2 9.9 L18.2 21.4 Q12 22.3 5.8 21.4 L5.8 9.9 L3.7 11.4 L1 8.6 L4.4 4.3 Z" fill="none" stroke="#f3ede6" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M15.96 13.20 C16.15 13.50 16.21 13.77 16.51 14.23 C16.81 14.69 18.01 15.74 17.77 15.98 C17.53 16.21 15.71 15.71 15.07 15.65 C14.43 15.59 14.22 15.57 13.93 15.62 C13.63 15.66 13.51 15.78 13.31 15.92 C13.11 16.05 12.96 16.28 12.74 16.43 C12.52 16.59 12.27 16.73 12.00 16.85 C11.73 16.98 11.51 16.92 11.09 17.17 C10.68 17.42 9.78 18.51 9.51 18.37 C9.24 18.24 9.57 16.82 9.47 16.37 C9.38 15.91 9.12 15.87 8.95 15.63 C8.77 15.39 8.52 15.19 8.42 14.92 C8.33 14.66 8.38 14.32 8.37 14.03 C8.36 13.74 8.67 13.55 8.35 13.20 C8.04 12.85 6.41 12.19 6.49 11.94 C6.58 11.69 8.42 11.86 8.87 11.69 C9.31 11.53 9.08 11.23 9.18 10.95 C9.27 10.66 9.27 10.24 9.44 9.99 C9.61 9.74 9.90 9.52 10.18 9.43 C10.47 9.33 10.83 9.42 11.14 9.41 C11.44 9.40 11.66 9.60 12.00 9.37 C12.34 9.13 12.92 7.93 13.19 8.00 C13.46 8.07 13.43 9.44 13.63 9.81 C13.83 10.18 13.90 10.24 14.39 10.20 C14.89 10.15 16.44 9.30 16.59 9.54 C16.73 9.78 15.46 11.15 15.26 11.63 C15.06 12.11 15.27 12.16 15.39 12.43 C15.51 12.69 15.78 12.90 15.96 13.20 Z" fill="#d61f26"/>
      <path d="M11.7 16.6 L11.8 19.8 A0.42 0.42 0 0 0 12.64 19.8 L12.6 16.4 Z" fill="#d61f26"/>
    </svg>
    <span>Behind the Jersey</span>
  </div>
  <h1>Sign in</h1>
  <p>This is a private preview for the team. Enter the password to continue.</p>
  <form id="form" novalidate>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit" type="submit">Sign in</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(function () {
  var KEY = 'btj-site-key';
  var DAYS = 30;
  var form = document.getElementById('form');
  var input = document.getElementById('password');
  var button = document.getElementById('submit');
  var msg = document.getElementById('msg');
  var params = new URLSearchParams(location.search);

  // Only go back to a page on this site.
  var next = params.get('next') || '/';
  if (next.charAt(0) !== '/' || next.charAt(1) === '/' || next.indexOf('\\') !== -1) next = '/';

  var say = function (text, error) { msg.textContent = text; msg.className = error ? 'msg error' : 'msg'; };
  var bytes = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var b64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };

  if (params.has('logout')) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    say('You’re signed out.');
  }

  var lock = fetch('/login/lock.json', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('no lock');
    return r.json();
  });

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    var password = input.value.trim().toLowerCase();
    if (!password) { say('Enter the password.', true); input.focus(); return; }
    button.disabled = true;
    say('Checking…');
    try {
      var l = await lock;
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
      var raw = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(l.salt), iterations: l.iterations }, base, 256);
      var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      try {
        await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(l.iv) }, key, bytes(l.check));
      } catch (e) {
        say('That’s not the password.', true);
        button.disabled = false;
        input.select();
        return;
      }
      try {
        localStorage.setItem(KEY, JSON.stringify({ k: b64(raw), exp: Date.now() + DAYS * 864e5 }));
      } catch (e) {
        say('Your browser blocked the sign-in (site storage is off). Allow site data and try again.', true);
        button.disabled = false;
        return;
      }
      say('Signed in.');
      location.replace(next);
    } catch (e) {
      say('This copy of the site isn’t password-protected. Go to the home page.', true);
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
