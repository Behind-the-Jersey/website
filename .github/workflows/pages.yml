name: Deploy to GitHub Pages
on:
  # Deploy only commits that passed CI on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Data for the live site: `live` (data/live: a release of Beyond-The-Jersey/data, brought in by a
  # reviewed pull request from .github/workflows/data-update.yml) or `seed` (the design handover's
  # data). The seed copy is always published at /demo/.
  LIVE_DATA_SOURCE: live

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          BTJ_DATA_SOURCE: ${{ env.LIVE_DATA_SOURCE }}
          NEXT_PUBLIC_SITE_URL: https://behind-the-jersey.org
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
